name: Windows Selftest

on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build
      - name: Run selftest
        run: .\src-tauri\target\release\boostx.exe --selftest
