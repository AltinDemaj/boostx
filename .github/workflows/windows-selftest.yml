name: Windows selftest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release binary
        run: npm run tauri build -- --no-bundle
        env:
          CI: true

      - name: Run tweak selftest (elevated runner)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "boostx.exe" src-tauri/target/release | Select-Object -First 1
          if (-not $exe) { throw "boostx.exe not found" }
          & $exe.FullName --selftest --report selftest-report.md
          Get-Content selftest-report.md | Select-Object -First 40

      - name: Upload selftest report
        uses: actions/upload-artifact@v4
        with:
          name: boostx-selftest-report
          path: |
            selftest-report.md
            selftest-report.json
