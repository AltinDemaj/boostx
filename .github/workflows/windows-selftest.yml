name: Windows selftest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release binary
        run: npm run tauri build -- --no-bundle
        env:
          CI: true

      - name: Simulate CS2 install for game-specific tweaks
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "boostx-cs2-sim"
          $exe = Join-Path $root "game\bin\win64\cs2.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $exe) | Out-Null
          Set-Content -Path $exe -Value "sim" -Encoding ascii
          echo "BOOSTX_SIM_CS2=$exe" >> $env:GITHUB_ENV

      - name: Run tweak selftest (elevated runner)
        shell: pwsh
        env:
          BOOSTX_MOCK_BENCH: "1"
        run: |
          $exe = Get-ChildItem -Recurse -Filter "boostx.exe" src-tauri/target/release | Select-Object -First 1
          if (-not $exe) { throw "boostx.exe not found" }
          & $exe.FullName --selftest --report selftest-report.md 2>&1 | Tee-Object -FilePath selftest-console.log
          $code = $LASTEXITCODE
          if (-not (Test-Path selftest-report.md)) {
            if (Test-Path selftest-console.log) { Get-Content selftest-console.log }
            throw "selftest-report.md not written (exit $code)"
          }
          Get-Content selftest-report.md | Select-Object -First 80
          if (Test-Path selftest-report.json) { Get-Content selftest-report.json | Select-Object -First 5 }
          if ($code -eq 2) { throw "selftest aborted with error (see report)" }
          if ($code -ne 0) { throw "selftest matrix reported failures (exit $code)" }

      - name: Upload selftest report
        uses: actions/upload-artifact@v4
        with:
          name: boostx-selftest-report
          path: |
            selftest-report.md
            selftest-report.json
