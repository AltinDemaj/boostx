// BoostX v0.2.1 — repeatable offline CS2 benchmark scene
// PresentMon captures cs2.exe for a fixed duration; BoostX closes the game when capture ends.

fps_max 0
mat_vsync 0
cl_showfps 0
r_show_build_info 0

// Offline competitive rules on dust2 (no bots — stable GPU load from map + camera motion)
mp_warmup_end
mp_freezetime 0
mp_roundtime 600
mp_ignore_round_win_conditions 1
bot_quota 0
sv_cheats 1

echo "[BoostX] Benchmark running — do not alt-tab"

// Slow orbit to keep the view changing (works offline with sv_cheats)
alias bx_orbit "+turnleft 4; wait 8; -turnleft; +turnright 4; wait 8; -turnright; bx_orbit"
bx_orbit
